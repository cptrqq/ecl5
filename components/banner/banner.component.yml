$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Banner
status: stable
description: 'Hero banner with background image or video, title, description and a call-to-action.'
props:
  type: object
  properties:
    id:
      type: string
      default: banner
    title:
      type: string
    description:
      type: string
    credit:
      type: string
    picture:
      type: object
    video:
      type: object
    cta:
      type: object
      description: 'Call-to-action link props ({ label, path }).'
    size:
      type: string
      enum: [xs, s, m, l]
      default: m
    variant:
      type: string
      enum: ['', overlay]
      description: 'overlay renders the semi-transparent background overlay (ecl-banner--overlay).'
    box:
      type: string
      enum: ['', light, dark, none]
      description: 'Content box background. light is the default (no modifier class).'
    color:
      type: string
      enum: ['', light]
      description: 'Text color over media. dark is the default (no modifier class).'
    sr_play:
      type: string
      default: Play
      description: 'Screen-reader label of the video play button.'
    sr_pause:
      type: string
      default: Pause
      description: 'Screen-reader label of the video pause button.'
    horizontal:
      type: string
      enum: ['', left, center, right]
    vertical:
      type: string
      enum: ['', top, center, bottom]
    full_width:
      type: boolean
    extra_classes:
      type: string
