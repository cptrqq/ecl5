$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Blockquote
status: stable
description: 'ECL blockquote with citation, author and optional image.'
props:
  type: object
  properties:
    citation:
      type: string
    author:
      type: string
    lang:
      type: string
    picture:
      type: object
      description: 'Picture props ({ img: { src, alt }, sources }).'
    extra_classes:
      type: string
