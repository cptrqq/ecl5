$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Breadcrumb
status: stable
description: 'Breadcrumb trail; the last item is the current page.'
props:
  type: object
  properties:
    links:
      type: array
      description: 'Ordered list of { label, path }. The last entry is rendered as the current page.'
      items:
        type: object
    aria_label:
      type: string
      default: 'You are here:'
    extra_classes:
      type: string
