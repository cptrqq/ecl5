$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Menu
status: stable
description: 'Main site navigation menu with a mobile hamburger toggle and mega submenus.'
props:
  type: object
  properties:
    id:
      type: string
      default: menu
    title:
      type: string
      default: Menu
    items:
      type: array
      description: 'List of menu-item props.'
      items:
        type: object
    toggle_label:
      type: string
      default: Menu
    close_label:
      type: string
      default: Close
    see_all_label:
      type: string
      default: 'See all'
    max_lines:
      type: integer
      default: 2
      description: 'Number of lines for each first-level item label. 0 disables the behavior.'
    back_label:
      type: string
      default: ''
      description: 'Mobile "back" button label. Leave empty to omit the button.'
    previous_label:
      type: string
      default: ''
      description: 'Screen-reader label of the previous-items button (menu overflow).'
    next_label:
      type: string
      default: ''
      description: 'Screen-reader label of the next-items button (menu overflow).'
    extra_classes:
      type: string
