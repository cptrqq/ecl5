$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Menu
status: stable
description: 'Main site navigation menu with a mobile hamburger toggle and mega submenus.'
props:
  type: object
  properties:
    id:
      type: string
      default: menu
    title:
      type: string
      default: Menu
    items:
      type: array
      description: 'List of menu-item props.'
      items:
        type: object
    toggle_label:
      type: string
      default: Menu
    close_label:
      type: string
      default: Close
    see_all_label:
      type: string
      default: 'See all'
    extra_classes:
      type: string
