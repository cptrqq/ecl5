$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: News ticker
status: stable
description: 'Rotating list of short news items with prev/next and play/pause controls.'
props:
  type: object
  properties:
    id:
      type: string
      default: news-ticker-slides
    items:
      type: array
      description: 'List of { icon, content, link, external }.'
      items:
        type: object
    sr_previous:
      type: string
      default: Previous
    sr_next:
      type: string
      default: Next
    sr_play:
      type: string
      default: Play
    sr_pause:
      type: string
      default: Pause
    extra_classes:
      type: string
