$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Popover
status: stable
description: 'A toggle button that reveals a floating panel of content.'
props:
  type: object
  properties:
    id:
      type: string
      default: popover-content
    toggle:
      type: object
      description: 'Button props ({ label, icon }) for the trigger.'
    close_label:
      type: string
      default: Close
    extra_classes:
      type: string
slots:
  content:
    title: Content
