$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Radio
status: stable
description: 'One or more radio buttons sharing a field name.'
props:
  type: object
  properties:
    name:
      type: string
    items:
      type: array
      description: 'List of { id, value, label, checked, disabled, required, helper }.'
      items:
        type: object
    extra_classes:
      type: string
