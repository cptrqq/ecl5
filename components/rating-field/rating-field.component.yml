$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Rating field
status: stable
description: 'Star rating built from radio inputs.'
props:
  type: object
  properties:
    id:
      type: string
      default: rating
    name:
      type: string
      default: rating
    items:
      type: array
      description: 'List of { value, label, checked } ordered from highest to lowest.'
      items:
        type: object
    disabled:
      type: boolean
    required:
      type: boolean
    extra_classes:
      type: string
