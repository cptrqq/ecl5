$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Text area
status: stable
description: 'Multi-line text input.'
props:
  type: object
  properties:
    id:
      type: string
    name:
      type: string
    value:
      type: string
    placeholder:
      type: string
    rows:
      type: integer
      default: 4
    disabled:
      type: boolean
    required:
      type: boolean
    invalid:
      type: boolean
    extra_classes:
      type: string
